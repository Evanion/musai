name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: swift test
    # Apple Silicon only — the platform floor is macOS 14 and the agent is a menu-bar app — and
    # macos-15 is an arm64 image carrying Xcode 16.x, whose Swift is 6.1, the version
    # `// swift-tools-version: 6.1` requires.
    runs-on: macos-15
    # A test that hangs must fail with a log inside half an hour, not sit in the job's six-hour
    # default. One did: the first run of this workflow spent over an hour inside `swift test` and
    # was still going when it was cancelled.
    timeout-minutes: 30
    steps:
      - name: Check out Musai
        uses: actions/checkout@v4
        with:
          path: musai

      # The engine is a SwiftPM *path* dependency, so it has to sit beside the repository. It is a
      # public repository, so the default token reads it and no secret is needed.
      - name: Check out the engine package
        uses: actions/checkout@v4
        with:
          repository: NorvoDB/norvo-swift
          path: norvo-swift

      - name: Require a Swift 6.1 or later toolchain
        run: |
          swift --version
          if ! swift --version | grep -qE 'Swift version 6\.[1-9]'; then
            echo "::error::swift-tools-version: 6.1 needs Swift 6.1+. If the macos-15 image regresses, add swift-actions/setup-swift@v2 with swift-version: '6.1' before this step."
            exit 1
          fi

      # The cache key includes the schema, the migrations and the operations, not just
      # Package.resolved — because NorvoCodegen's generated Swift outlives the schema it came from,
      # so a cached .build whose schema has since changed would compile stale symbols.
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            musai/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('musai/Package.resolved') }}-${{ hashFiles('musai/Sources/MusaiCore/schema.nql', 'musai/Sources/MusaiCore/migrations/**', 'musai/Sources/MusaiCore/operations/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-

      - name: Probe the runner's environment
        working-directory: musai
        run: |
          echo "=== the machine ==="
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          echo "=== the engine as this job resolved it ==="
          find .build/artifacts -name norvo -type f 2>/dev/null | head -2 | while read f; do echo "$f"; lipo -archs "$f" 2>&1; done
          find .build/artifacts -name CNorvoLite -type f 2>/dev/null | head -2 | while read f; do echo "$f"; lipo -archs "$f" 2>&1; done

      # These probes exist because the suite hangs on a runner while passing in 5 seconds on a
      # developer's Mac, and the only split the log showed was engine-free tests passing and every
      # engine-touching test never finishing. Two minutes each, and a failure here does not fail the
      # job, so the log carries the answer either way.
      - name: Probe — can the engine open a store here?
        continue-on-error: true
        timeout-minutes: 3
        working-directory: musai
        env:
          MUSAI_NORVO_PATH: ${{ github.workspace }}/norvo-swift
          NSUnbufferedIO: "YES"
        run: |
          swift test --no-parallel --filter "theGraphMigratesAndIntrospects"
          echo "PROBE RESULT: the engine opened a store and ran a query"

      - name: Probe — can a listener bind and answer here?
        continue-on-error: true
        timeout-minutes: 3
        working-directory: musai
        env:
          MUSAI_NORVO_PATH: ${{ github.workspace }}/norvo-swift
          NSUnbufferedIO: "YES"
        run: |
          swift test --no-parallel --filter "theListenerServesTheEndpoint"
          echo "PROBE RESULT: a listener bound and answered"

      # NORVO_LOCAL is deliberately NOT set. With it unset the package resolves the *released*
      # engine bundle — binaries-v0.0.2, which carries the @convert fix this repository depends on.
      # Setting it would point the build at whatever a local engine checkout happens to contain,
      # which is how a stale pre-fix build once failed `norvo codegen` here.
      #
      # NSUnbufferedIO is set because the first run of this workflow hung for over an hour inside
      # `swift test` and the log showed *nothing* after "Build complete!" — SwiftPM's test output is
      # block-buffered when stdout is not a terminal, so a hang hides the very test that hung. If
      # this ever fails to unbuffer, `script -q /dev/null swift test` allocates a pty instead.
      #
      # --no-parallel names the culprit: in parallel mode the log shows 208 tests starting at once
      # and 24 finishing, and only a serial run says which one stopped. Once the hang is fixed this
      # can go back to SwiftPM's default parallelism.
      - name: Test
        working-directory: musai
        env:
          MUSAI_NORVO_PATH: ${{ github.workspace }}/norvo-swift
          NSUnbufferedIO: "YES"
        run: swift test --no-parallel
