name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The suite on a current Apple Silicon image. This is the job that should gate a merge.
  test:
    name: swift test (macos-26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out Musai
        uses: actions/checkout@v4
        with:
          path: musai

      # The engine is a SwiftPM *path* dependency, so it has to sit beside the repository. It is a
      # public repository, so the default token reads it and no secret is needed.
      - name: Check out the engine package
        uses: actions/checkout@v4
        with:
          repository: NorvoDB/norvo-swift
          path: norvo-swift

      - name: Show the toolchain
        run: swift --version

      # The cache key includes the schema, the migrations and the operations, not just
      # Package.resolved — because NorvoCodegen's generated Swift outlives the schema it came from,
      # so a cached .build whose schema has since changed would compile stale symbols.
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            musai/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('musai/Package.resolved') }}-${{ hashFiles('musai/Sources/MusaiCore/schema.nql', 'musai/Sources/MusaiCore/migrations/**', 'musai/Sources/MusaiCore/operations/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-

      # NORVO_LOCAL is deliberately NOT set. With it unset the package resolves the *released*
      # engine bundle — binaries-v0.0.2, which carries the @convert fix this repository depends on.
      # Setting it would point the build at whatever a local engine checkout happens to contain,
      # which is how a stale pre-fix build once failed `norvo codegen` here.
      #
      # NSUnbufferedIO is set because an earlier run of this workflow hung for over an hour inside
      # `swift test` and the log showed *nothing* after "Build complete!" — SwiftPM's test output is
      # block-buffered when stdout is not a terminal, so a hang hid the very test that hung. If this
      # ever fails to unbuffer, `script -q /dev/null swift test` allocates a pty instead.
      - name: Test
        working-directory: musai
        env:
          MUSAI_NORVO_PATH: ${{ github.workspace }}/norvo-swift
          NSUnbufferedIO: "YES"
        run: swift test

  # The same suite on the older image, as a diagnostic rather than a gate. It exists because the
  # suite hangs on macOS 15 / Swift 6.1.2 while passing in five seconds on macOS 26 / Swift 6.4 —
  # and because everything below is `continue-on-error`, this job reports what the older toolchain
  # does without failing the workflow.
  probe:
    name: probe (macos-15)
    runs-on: macos-15
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Check out Musai
        uses: actions/checkout@v4
        with:
          path: musai

      - name: Check out the engine package
        uses: actions/checkout@v4
        with:
          repository: NorvoDB/norvo-swift
          path: norvo-swift

      - name: The machine, and the engine as this job resolved it
        working-directory: musai
        run: |
          echo "=== the machine ==="
          sw_vers; uname -m; swift --version
          echo "=== the engine's architectures ==="
          find .build/artifacts -name norvo -type f 2>/dev/null | head -2 | while read f; do echo "$f"; lipo -archs "$f"; done
          find .build/artifacts -name "*.a" -type f 2>/dev/null | head -2 | while read f; do echo "$f"; lipo -archs "$f"; done

      - name: Probe — can the engine open a store on this toolchain?
        continue-on-error: true
        timeout-minutes: 3
        working-directory: musai
        env:
          MUSAI_NORVO_PATH: ${{ github.workspace }}/norvo-swift
          NSUnbufferedIO: "YES"
        run: |
          swift test --no-parallel --filter "theGraphMigratesAndIntrospects"
          echo "PROBE: the engine opened a store and ran a query"

      - name: Probe — can a listener bind and answer on this toolchain?
        continue-on-error: true
        timeout-minutes: 3
        working-directory: musai
        env:
          MUSAI_NORVO_PATH: ${{ github.workspace }}/norvo-swift
          NSUnbufferedIO: "YES"
        run: |
          swift test --no-parallel --filter "theListenerServesTheEndpoint"
          echo "PROBE: a listener bound and answered"

      # Serial, so the log ends on the test that hangs rather than showing all 208 start and 24
      # finish. Ten minutes is enough for the pure tests to pass and the first engine test to stop.
      - name: The suite, serially, to name the hang
        continue-on-error: true
        timeout-minutes: 10
        working-directory: musai
        env:
          MUSAI_NORVO_PATH: ${{ github.workspace }}/norvo-swift
          NSUnbufferedIO: "YES"
        run: swift test --no-parallel
